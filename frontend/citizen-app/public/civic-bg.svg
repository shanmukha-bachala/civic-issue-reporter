<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" width="2000" height="1200" role="img" aria-label="Civic theme background with map grid and location pins">
  <defs>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#EFF6FF" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#3B82F6" stroke-opacity="0.06" stroke-width="2"/>
      <path d="M 40 0 L 40 80 M 0 40 L 80 40" fill="none" stroke="#6366F1" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
    </filter>
    <g id="pin">
      <path d="M12 2c-4.418 0-8 3.134-8 7 0 5.25 8 13 8 13s8-7.75 8-13c0-3.866-3.582-7-8-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="#2563EB" fill-opacity="0.12" stroke="#2563EB" stroke-opacity="0.25" stroke-width="1"/>
    </g>
  </defs>

  <!-- Base grid pattern -->
  <rect width="2000" height="1200" fill="url(#grid)" />

  <!-- Soft shapes (blobs) for depth -->
  <g filter="url(#blur)">
    <circle cx="300" cy="250" r="180" fill="#A5B4FC" fill-opacity="0.20"/>
    <circle cx="1700" cy="350" r="220" fill="#93C5FD" fill-opacity="0.20"/>
    <circle cx="1000" cy="1000" r="260" fill="#C7D2FE" fill-opacity="0.18"/>
  </g>

  <!-- Location pins scattered -->
  <g transform="scale(3)">
    <use href="#pin" x="110" y="60"/>
    <use href="#pin" x="420" y="90"/>
    <use href="#pin" x="250" y="230"/>
    <use href="#pin" x="520" y="280"/>
    <use href="#pin" x="70" y="300"/>
  </g>

  <!-- Decorative connecting lines -->
  <path d="M120 800 C 400 720, 600 860, 900 780 S 1500 820, 1850 740" fill="none" stroke="#2563EB" stroke-opacity="0.12" stroke-width="4"/>
  <path d="M150 980 C 500 900, 1100 1080, 1800 920" fill="none" stroke="#6366F1" stroke-opacity="0.10" stroke-width="3"/>

</svg>
